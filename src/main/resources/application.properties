# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smartpa?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=SmartPA_Super_Secret_Key_2024_Prasanna_AI_Assistant_Application
jwt.expiration=86400000

# Groq AI (OpenAI-compatible)

openai.model=llama-3.3-70b-versatile
openai.api.url=https://api.groq.com/openai/v1/chat/completions

# CORS
cors.allowed-origins=http://localhost:5173

# Scheduling
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.smartpa=DEBUG
logging.level.root=WARN
