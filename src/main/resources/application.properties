# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartpa}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Groq AI (OpenAI-compatible)

openai.api.key=${OPENAI_API_KEY}
openai.model=llama-3.3-70b-versatile
openai.api.url=https://api.groq.com/openai/v1/chat/completions

# CORS
cors.allowed-origins=http://localhost:5173

# Scheduling
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.smartpa=DEBUG
logging.level.root=WARN
