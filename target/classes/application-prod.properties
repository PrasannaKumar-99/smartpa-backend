# Production config for Render deployment
# Server
server.port=${PORT:8080}

# Database (Render Postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:mySecretKey}
jwt.expiration=86400000

# Groq AI (OpenAI-compatible)
openai.api.key=${OPENAI_API_KEY}
openai.model=llama-3.3-70b-versatile
openai.api.url=https://api.groq.com/openai/v1/chat/completions

# CORS (update for production frontend URL)
cors.allowed-origins=https://your-frontend.onrender.com,http://localhost:5173

# Logging (prod level)
logging.level.com.smartpa=WARN
logging.level.root=ERROR
